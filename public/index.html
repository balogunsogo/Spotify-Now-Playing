<!doctype html>
<html lang="en">

<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FHK20RM2N0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-FHK20RM2N0');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing</title>
  <meta name="description" content="See what’s currently playing on my Spotify" />
  <meta property="og:title" content="Oluwasogo Balogun — Now Playing" />
  <meta property="og:description" content="See what’s currently playing on my Spotify" />
  <meta property="og:url" content="https://balogunoluwasogo-now-playing.vercel.app/" />
  <meta property="og:image" content="https://balogunoluwasogo-now-playing.vercel.app/og-image.png" />
  <meta property="og:image:secure_url" content="https://balogunoluwasogo-now-playing.vercel.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oluwasogo Balogun — Now Playing" />
  <meta name="twitter:description" content="See what’s currently playing on my Spotify" />
  <meta name="twitter:image" content="https://balogunoluwasogo-now-playing.vercel.app/og-image.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://i.scdn.co" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/experiments.css" />
</head>



<body>
  <div id="ambient-scene" class="ambient-scene" aria-hidden="true">
    <div id="ambient-layer-a" class="ambient-layer is-active"></div>
    <div id="ambient-layer-b" class="ambient-layer"></div>
    <div class="ambient-grain"></div>
    <div class="ambient-shade"></div>
  </div>

  <header class="site-topbar" aria-label="Site status">
    <a class="brand-name" href="https://balogunoluwasogo.webflow.io/" target="_blank" rel="noreferrer">
      Oluwasogo<br />Balogun
    </a>

    <div id="presence-badge" class="presence-badge is-offline">Offline</div>

    <div class="location-time" aria-label="Current time in Lagos, Nigeria">
      <span>Lagos, NG</span>
      <time id="lagos-time" datetime="">--:-- WAT</time>
    </div>
  </header>

  <main class="page-shell">
    <section id="player" class="player is-offline" aria-live="polite">
      <div class="art-stage">
        <div class="art-wrap">
          <img
            id="album-art"
            class="album-art"
            alt=""
            crossorigin="anonymous"
            decoding="async"
            fetchpriority="high"
          />
          <span id="art-fallback" class="art-fallback" hidden>SP</span>
          <span class="art-reflection" aria-hidden="true"></span>
        </div>
      </div>

      <div class="track-copy">
        <div class="status-row">
          <span class="equalizer" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <p id="status" class="status">Connecting to Spotify</p>
        </div>

        <p id="title" class="song-title">Loading...</p>
        <p id="artist" class="artist"></p>
        <p id="album" class="album"></p>

        <div class="actions">
          <a id="spotify-link" class="spotify-link" href="#" target="_blank" rel="noreferrer">
            <span>Open in Spotify</span>
          </a>
          <span id="explicit" class="explicit" hidden>Explicit</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="about-wrap">
      <button
        id="about-toggle"
        class="info-button"
        type="button"
        aria-label="What is this?"
        aria-expanded="false"
        aria-controls="about-popover"
        title="What is this?"
      >
        <span aria-hidden="true">i</span>
      </button>
      <div id="about-popover" class="about-popover" role="dialog" aria-label="About this website" hidden>
        <h2>Live Now Playing</h2>
        <p>
          A live window into what I’m listening to on Spotify - synced in real time through the Spotify Web API.
        </p>
      </div>
    </div>

    <button
      id="previous-toggle"
      class="info-button previous-toggle"
      type="button"
      aria-label="Previously played"
      aria-expanded="false"
      aria-controls="previous-drawer"
      title="Previously played"
    >
      <span class="history-icon" aria-hidden="true"></span>
    </button>
  </footer>

  <aside id="previous-drawer" class="previous-drawer" aria-label="Previously observed tracks" hidden>
    <div class="previous-drawer-head">
      <span>Previously</span>
      <button id="previous-close" type="button" aria-label="Close previous tracks">Close</button>
    </div>
    <div id="previous-list" class="previous-list"></div>
  </aside>

  <div id="modal-scrim" class="modal-scrim" hidden></div>

  <script src="/experiments.js" type="module"></script>
  <script src="/app.js" type="module"></script>
</body>

</html>
